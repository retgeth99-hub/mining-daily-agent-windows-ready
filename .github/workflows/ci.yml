# 两个独立 job 并行：
#   gate        —— 代码质量门禁，命令的唯一来源是 scripts/gate.sh（本地跑的是同一个脚本）
#   docker-build —— 镜像构建验证
#
# 拆成两个 job 而不是串成一个：构建失败与门禁失败在 PR 界面上能一眼区分；两者互不阻塞，
# 反馈也更快。Dockerfile 的缺陷（比如漏 COPY 清单）只有真正构建才会暴露，读代码发现不了。
#
# 测试全部 mock 了网络与 LLM，构建也不需要密钥，
# 因此这里不需要任何 secrets，也不访问外部数据源。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        # 注意：本 action 没有 v10 这类大版本标签，只能钉完整版本号。
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: 同步依赖
        run: uv sync --locked

      - name: 质量门禁
        run: bash scripts/gate.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Buildx
        # Dockerfile 用了 `RUN --mount=type=cache`，需要 BuildKit；官方构建缓存
        # （type=gha）也依赖 buildx。
        uses: docker/setup-buildx-action@v4

      - name: 构建镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          # 只验证能否构建，不推送到任何 registry。
          push: false
          # GHA 层缓存：依赖层只在 pyproject.toml / uv.lock 变化时才失效，
          # 其余提交直接命中缓存，不必每次全量重装依赖。
          cache-from: type=gha
          cache-to: type=gha,mode=max
