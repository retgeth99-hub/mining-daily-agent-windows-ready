# 门禁命令的唯一来源是 scripts/gate.sh——这里只调它，不要重复列出 ruff/mypy/pytest
# 的具体命令，否则改一处漏一处。
#
# 脚本用 language: system + `uv run`，复用项目自身的 uv 环境；若改用单独的 hook 仓库，
# mypy 会在一个看不到项目依赖的隔离环境里运行，导致第三方包全部报 unresolved import。
repos:
  - repo: local
    hooks:
      - id: gate
        name: quality gate (scripts/gate.sh)
        entry: bash scripts/gate.sh
        language: system
        # 只在改到 Python 文件时跑：门禁包含 pytest（约 10 秒），纯文档提交不必付这个代价。
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

# 注意：门禁是**只检查、不修改**的。它不会像早先的 ruff --fix / ruff format 钩子那样
# 顺手改文件——提交被拦下时，自己跑 `uv run ruff format` 与 `uv run ruff check --fix .`
# 修好再提交。
